version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: contractos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractos
      POSTGRES_PASSWORD: contractos_dev_2025
      POSTGRES_DB: contractos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contractos']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
